name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App for Production
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build and Archive
      run: |
        cd ios_project
        xcodebuild -project TikTokIOSApp.xcodeproj -scheme TikTokIOSApp -sdk iphoneos -configuration Release archive -archivePath build/TikTokIOSApp.xcarchive
        xcodebuild -exportArchive -archivePath build/TikTokIOSApp.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/
      env:
        # Add your signing credentials or development secrets here
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: ios_project/build/*.ipa
    - name: Verify build outputs
      run: echo "Build workflow completed successfully!"
