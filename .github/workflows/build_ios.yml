name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App (.ipa) for Sideloadly
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Compile and Package into .ipa
      run: |
        echo "Compiling Swift files for iOS 17..."
        mkdir -p Payload/TikTokIOSApp.app
        
        # Compile Swift files into iOS arm64 binary targeting iOS 17
        xcrun swiftc -target arm64-apple-ios17.0 \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework SwiftUI \
          -framework UIKit \
          -framework AVFoundation \
          -framework Photos \
          TikTokIOSApp.swift Views/*.swift \
          -o Payload/TikTokIOSApp.app/TikTokIOSApp
          
        python3 -c "
        plist = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
        <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
        <plist version=\"1.0\">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.tiktok.ios.you</string>
            <key>CFBundleName</key>
            <string>TikTok You</string>
            <key>CFBundleExecutable</key>
            <string>TikTokIOSApp</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>4.4</string>
            <key>UIDeviceFamily</key>
            <array><integer>1</integer></array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
        </dict>
        </plist>'''
        with open('Payload/TikTokIOSApp.app/Info.plist', 'w') as f:
            f.write(plist)
        "
        
        zip -r TikTokIOSApp.ipa Payload
        mkdir -p build_output
        mv TikTokIOSApp.ipa build_output/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TikTokIOSApp-ipa
        path: build_output/*.ipa
