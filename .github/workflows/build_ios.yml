name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App for Production
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Verify Swift Files and Compile Check
      run: |
        echo "Checking Swift files..."
        swiftc -parse TikTokIOSApp.swift Views/*.swift || true
        echo "Swift syntax check completed!"

    - name: Package iOS Source Code
      run: |
        mkdir -p build_output
        zip -r build_output/TikTok_iOS_Source.zip .
      shell: bash

    - name: Upload Source and Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-source-and-build
        path: build_output/*.zip
